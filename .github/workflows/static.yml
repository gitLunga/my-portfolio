# Build the React app and deploy the compiled output to GitHub Pages.
#
# NOTE: the previous version of this workflow uploaded `path: '.'` — the raw
# repository — and never ran a build. There is no index.html at the repo root
# (it lives in public/), so Pages had nothing to serve. This builds first.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # CI=true turns warnings into errors on CRA; we lint separately.
        env:
          CI: false
        run: npm run build

      # GitHub Pages has no SPA rewrite rule. Serving the same document as
      # 404.html lets client-side routes (/about, /project) survive a hard
      # refresh or a shared deep link.
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      # Stops Pages running the output through Jekyll, which would strip
      # any file or folder beginning with an underscore.
      - name: Disable Jekyll processing
        run: touch build/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
