# Netlify serves the site from the domain root; GitHub Pages serves it from
# /my-portfolio/. Vite's `base` config option (vite.config.js) defaults to
# "/" when VITE_BASE_PATH isn't set, which is exactly right for Netlify —
# nothing needs setting here, unlike the GitHub Pages workflow which does.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: hand every unmatched path to index.html so React Router
# can resolve it client-side instead of Netlify returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite's build output convention is build/assets/*, not build/static/* —
# this was written for the old CRA/webpack layout and, unnoticed, was never
# actually matching anything after the migration to Vite's own layout.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
